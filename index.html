<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cupudle</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d14;
      --surface:     rgba(255,255,255,0.04);
      --border:      rgba(255,255,255,0.12);
      --filled:      rgba(255,255,255,0.25);
      --correct:     #4ade80;
      --present:     #fbbf24;
      --absent:      rgba(255,255,255,0.07);
      --absent-text: rgba(255,255,255,0.3);
      --text:        #f0f0f5;
      --radius:      10px;
      --accent:      linear-gradient(100deg, #7c3aed, #2563eb);
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(139,92,246,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59,130,246,0.15) 0%, transparent 60%);
      min-height: 100dvh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── AUTH SCREEN ─────────────────────────────────────────── */
    #auth-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .auth-card {
      background: linear-gradient(145deg, #1a1730, #0f0f1f);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      padding: 48px 40px 40px;
      width: min(400px, 100%);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
      animation: auth-in 0.4s cubic-bezier(0.34,1.4,0.64,1);
    }
    @keyframes auth-in {
      from { transform: scale(0.9) translateY(16px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }

    .auth-logo {
      font-size: 2rem; font-weight: 800; letter-spacing: 0.35em;
      background: linear-gradient(100deg, #c084fc, #818cf8, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-align: center; margin-bottom: 6px;
    }
    .auth-tagline {
      text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.3);
      letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 40px;
    }
    .auth-title { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 28px; color: rgba(255,255,255,0.85); }

    .auth-error {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px; padding: 10px 14px; font-size: 0.8rem; color: #fca5a5;
      margin-bottom: 18px; display: none; text-align: center;
    }
    .auth-error.show { display: block; }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.4);
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text);
      font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 500;
      outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: rgba(139,92,246,0.55); background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
    }
    .form-input::placeholder { color: rgba(255,255,255,0.18); }

    .auth-btn {
      width: 100%; padding: 15px; border: none; border-radius: 13px;
      background: var(--accent); color: #fff;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.06em; cursor: pointer; margin-top: 10px;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
    }
    .auth-btn:hover  { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,58,237,0.35); }
    .auth-btn:active { transform: scale(0.98); }

    .auth-toggle { text-align: center; margin-top: 22px; font-size: 0.82rem; color: rgba(255,255,255,0.35); }
    .auth-toggle span { color: #818cf8; cursor: pointer; font-weight: 600; }
    .auth-toggle span:hover { color: #c084fc; }

    /* ── GAME SCREEN ──────────────────────────────────────────── */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    /* ── HEADER ───────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 900px;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .header-user { display: flex; align-items: center; gap: 9px; }

    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.88rem; font-weight: 800; flex-shrink: 0;
    }
    .user-name {
      font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.55);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;
    }
    .header-center { text-align: center; }

    h1 {
      font-size: clamp(1.4rem, 4.5vw, 2rem); font-weight: 800; letter-spacing: 0.35em;
      background: linear-gradient(100deg, #c084fc, #818cf8, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle { font-size: 0.65rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.3); text-transform: uppercase; }

    .logout-btn {
      justify-self: end;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: rgba(255,255,255,0.4);
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }

    /* ── MAIN LAYOUT (game + ranking side by side) ────────────── */
    #main-layout {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 28px;
      width: 100%;
      max-width: 900px;
      padding: 0 16px;
      flex: 1;
    }

    #game-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── RANKING PANEL ────────────────────────────────────────── */
    #ranking-panel {
      width: 230px;
      flex-shrink: 0;
      padding-top: 28px;
      padding-bottom: 20px;
    }

    .rank-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border-radius: 10px;
      margin-bottom: 5px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
      min-height: 42px;
      transition: background 0.2s, border-color 0.2s;
    }
    .rank-item.rank-me {
      background: rgba(124,58,237,0.13);
      border-color: rgba(124,58,237,0.32);
    }
    .rank-item.rank-new {
      animation: rank-pop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes rank-pop {
      from { transform: scale(0.92); opacity: 0.4; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .rank-pos {
      width: 26px; font-size: 0.8rem; font-weight: 800;
      text-align: center; flex-shrink: 0; line-height: 1;
      color: rgba(255,255,255,0.22);
    }
    .rank-pos.gold   { color: #fbbf24; }
    .rank-pos.silver { color: #94a3b8; }
    .rank-pos.bronze { color: #c47a3a; }

    .rank-name {
      flex: 1; font-size: 0.84rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rank-name.empty { color: rgba(255,255,255,0.13); font-weight: 400; }

    .rank-badge {
      font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.07); padding: 3px 8px;
      border-radius: 6px; flex-shrink: 0; white-space: nowrap;
    }

    @media (max-width: 720px) {
      #main-layout { flex-direction: column; align-items: center; gap: 0; }
      #ranking-panel {
        width: 100%; max-width: 480px; padding-top: 20px; padding-bottom: 28px;
        border-top: 1px solid rgba(255,255,255,0.07); margin-top: 4px;
      }
    }

    /* ── TOAST ────────────────────────────────────────────────── */
    #toast {
      position: fixed; top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: rgba(255,255,255,0.92); color: #111;
      font-size: 0.82rem; font-weight: 700; letter-spacing: 0.06em;
      padding: 8px 20px; border-radius: 40px; pointer-events: none;
      opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── BOARD ────────────────────────────────────────────────── */
    #board-wrap {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 12px 16px; perspective: 600px;
    }
    #board { display: flex; flex-direction: column; gap: 7px; }
    .row   { display: flex; gap: 7px; }

    .tile {
      width: clamp(46px, 10.5vw, 58px); height: clamp(46px, 10.5vw, 58px);
      border: 2px solid var(--border); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.2rem, 3.5vw, 1.6rem); font-weight: 800;
      text-transform: uppercase; background: var(--surface);
      user-select: none; transform-style: preserve-3d; transition: border-color 0.1s;
    }
    .tile[data-letter]  { border-color: var(--filled); }
    .tile.correct { background: var(--correct); border-color: var(--correct);  color: #0a1a10; }
    .tile.present { background: var(--present); border-color: var(--present);  color: #1a1200; }
    .tile.absent  { background: var(--absent);  border-color: transparent;     color: var(--absent-text); }

    @keyframes pop      { 0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)} }
    @keyframes shake    { 0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}36%{transform:translateX(7px)}54%{transform:translateX(-5px)}72%{transform:translateX(5px)} }
    @keyframes bounce   { 0%,100%{transform:translateY(0)}45%{transform:translateY(-14px)} }
    @keyframes flip-out { from{transform:rotateX(0deg)} to{transform:rotateX(-90deg)} }
    @keyframes flip-in  { from{transform:rotateX(90deg)} to{transform:rotateX(0deg)} }

    .tile.pop      { animation: pop      0.12s ease-out; }
    .row.shake     { animation: shake    0.48s ease-out; }
    .tile.bounce   { animation: bounce   0.4s  ease-out; }
    .tile.flip-out { animation: flip-out 0.18s ease-in  forwards; }
    .tile.flip-in  { animation: flip-in  0.22s ease-out forwards; }

    /* ── KEYBOARD ─────────────────────────────────────────────── */
    #keyboard {
      width: 100%; max-width: 500px; padding: 0 8px 20px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .kb-row { display: flex; justify-content: center; gap: 5px; }

    .key {
      height: clamp(46px, 9vw, 56px); min-width: clamp(28px, 7vw, 40px);
      padding: 0 3px; border: none; border-radius: 8px;
      background: rgba(255,255,255,0.12); color: var(--text);
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(0.65rem, 2.2vw, 0.85rem);
      font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
      transition: background 0.15s, transform 0.08s, color 0.2s;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .key.wide { min-width: clamp(48px, 12vw, 62px); font-size: clamp(0.58rem, 1.8vw, 0.75rem); }
    .key:hover  { background: rgba(255,255,255,0.22); }
    .key:active { transform: scale(0.94); }
    .key.correct { background: var(--correct); color: #0a1a10; }
    .key.present { background: var(--present); color: #1a1200; }
    .key.absent  { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.22); }

    /* ── MODAL ────────────────────────────────────────────────── */
    #modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); z-index: 300;
      align-items: center; justify-content: center;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: linear-gradient(145deg, #1a1730, #0f0f1f);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      padding: 44px 36px 36px; text-align: center; width: min(340px, 90vw);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
      animation: modal-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modal-in { from{transform:scale(0.85) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }

    .modal-icon  { font-size: 3.2rem; line-height: 1; margin-bottom: 14px; }
    .modal-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.02em; margin-bottom: 6px; }
    .modal-desc  { font-size: 0.82rem; color: rgba(255,255,255,0.45); margin-bottom: 14px; letter-spacing: 0.05em; }
    .modal-word  {
      font-size: 2rem; font-weight: 800; letter-spacing: 0.28em;
      background: linear-gradient(100deg, #c084fc, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 28px;
    }
    .modal-btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem;
      font-weight: 700; letter-spacing: 0.06em; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .modal-btn:hover  { opacity: 0.9; transform: translateY(-1px); }
    .modal-btn:active { transform: scale(0.97); }

    /* ── CONFETTI ─────────────────────────────────────────────── */
    .confetti-piece {
      position: fixed; width: 10px; height: 10px; top: -20px;
      border-radius: 2px; animation: fall linear forwards;
      z-index: 250; pointer-events: none;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>

<!-- ── AUTH SCREEN ──────────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">CUPUDLE</div>
    <p class="auth-tagline">Adivina la palabra de 6 letras</p>

    <div class="auth-title" id="auth-title">Crear cuenta</div>
    <div class="auth-error" id="auth-error"></div>

    <form id="auth-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="auth-username">Nombre de usuario</label>
        <input class="form-input" id="auth-username" type="text"
               placeholder="Tu nombre..." autocomplete="off" spellcheck="false" />
      </div>
      <div class="form-group">
        <label class="form-label" for="auth-password">Contraseña</label>
        <input class="form-input" id="auth-password" type="password"
               placeholder="••••••••" autocomplete="new-password" />
      </div>
      <button class="auth-btn" type="submit" id="auth-btn">Registrarse</button>
    </form>

    <p class="auth-toggle" id="auth-toggle">
      ¿Ya tenés cuenta? <span onclick="toggleAuthMode()">Iniciar sesión</span>
    </p>
  </div>
</div>

<!-- ── GAME SCREEN ──────────────────────────────────────────────── -->
<div id="game-screen">

  <header>
    <div class="header-user">
      <div class="user-avatar" id="player-avatar">?</div>
      <span class="user-name" id="player-name"></span>
    </div>
    <div class="header-center">
      <h1>CUPUDLE</h1>
      <p class="subtitle">6 letras · 6 intentos</p>
    </div>
    <button class="logout-btn" onclick="logout()" title="Cerrar sesión">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <div id="toast"></div>

  <!-- side-by-side wrapper -->
  <div id="main-layout">

    <!-- GAME -->
    <div id="game-panel">
      <div id="board-wrap">
        <div id="board"></div>
      </div>
      <div id="keyboard">
        <div class="kb-row">
          <button class="key" data-key="Q">Q</button>
          <button class="key" data-key="W">W</button>
          <button class="key" data-key="E">E</button>
          <button class="key" data-key="R">R</button>
          <button class="key" data-key="T">T</button>
          <button class="key" data-key="Y">Y</button>
          <button class="key" data-key="U">U</button>
          <button class="key" data-key="I">I</button>
          <button class="key" data-key="O">O</button>
          <button class="key" data-key="P">P</button>
        </div>
        <div class="kb-row">
          <button class="key" data-key="A">A</button>
          <button class="key" data-key="S">S</button>
          <button class="key" data-key="D">D</button>
          <button class="key" data-key="F">F</button>
          <button class="key" data-key="G">G</button>
          <button class="key" data-key="H">H</button>
          <button class="key" data-key="J">J</button>
          <button class="key" data-key="K">K</button>
          <button class="key" data-key="L">L</button>
          <button class="key" data-key="Ñ">Ñ</button>
        </div>
        <div class="kb-row">
          <button class="key wide" data-key="ENTER">ENTER</button>
          <button class="key" data-key="Z">Z</button>
          <button class="key" data-key="X">X</button>
          <button class="key" data-key="C">C</button>
          <button class="key" data-key="V">V</button>
          <button class="key" data-key="B">B</button>
          <button class="key" data-key="N">N</button>
          <button class="key" data-key="M">M</button>
          <button class="key wide" data-key="BACKSPACE">⌫</button>
        </div>
      </div>
    </div>

    <!-- RANKING -->
    <div id="ranking-panel">
      <div class="rank-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        Ranking
      </div>
      <div id="rank-list"></div>
    </div>

  </div><!-- /main-layout -->

  <div id="modal">
    <div class="modal-box">
      <div class="modal-icon"  id="m-icon">🎉</div>
      <div class="modal-title" id="m-title">¡Ganaste!</div>
      <div class="modal-desc"  id="m-desc">La palabra era</div>
      <div class="modal-word">FABULA</div>
      <button class="modal-btn" id="m-btn">Jugar de nuevo</button>
    </div>
  </div>

</div><!-- /game-screen -->

<script>
// ── API ───────────────────────────────────────────────────────────────

const TOKEN_KEY = 'cupudle_token';
const USER_KEY  = 'cupudle_user';

const getToken   = ()  => localStorage.getItem(TOKEN_KEY);
const getStoredUser = () => localStorage.getItem(USER_KEY);
const saveToken  = (t, u) => { localStorage.setItem(TOKEN_KEY, t); localStorage.setItem(USER_KEY, u); };
const clearToken = ()  => { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); };

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
}

async function apiCall(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: authHeaders(),
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}

// ── AUTH ──────────────────────────────────────────────────────────────

let authMode    = 'register';
let currentUser = '';

function toggleAuthMode() {
  authMode = authMode === 'register' ? 'login' : 'register';
  const isLogin = authMode === 'login';
  document.getElementById('auth-title').textContent = isLogin ? 'Iniciar sesión' : 'Crear cuenta';
  document.getElementById('auth-btn').textContent   = isLogin ? 'Entrar'         : 'Registrarse';
  document.getElementById('auth-toggle').innerHTML  = isLogin
    ? '¿No tenés cuenta? <span onclick="toggleAuthMode()">Crear cuenta</span>'
    : '¿Ya tenés cuenta? <span onclick="toggleAuthMode()">Iniciar sesión</span>';
  setAuthError('');
}

function setAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

function setAuthLoading(loading) {
  const btn = document.getElementById('auth-btn');
  btn.disabled = loading;
  btn.style.opacity = loading ? '0.6' : '1';
}

document.getElementById('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;

  if (!username)           return setAuthError('Ingresá tu nombre de usuario');
  if (username.length < 2) return setAuthError('El nombre debe tener al menos 2 caracteres');
  if (!password)           return setAuthError('Ingresá tu contraseña');
  if (password.length < 4) return setAuthError('La contraseña debe tener al menos 4 caracteres');

  setAuthLoading(true);
  try {
    const endpoint = authMode === 'register' ? '/api/register' : '/api/login';
    const { token, username: displayName } = await apiCall('POST', endpoint, { username, password });
    saveToken(token, displayName);
    enterGame(displayName);
  } catch (err) {
    setAuthError(err.message);
  } finally {
    setAuthLoading(false);
  }
});

function logout() {
  clearToken();
  currentUser = '';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('auth-username').value = '';
  document.getElementById('auth-password').value = '';
  setAuthError('');
  if (authMode !== 'register') toggleAuthMode();
}

async function enterGame(username) {
  currentUser = username;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  document.getElementById('player-avatar').textContent = username[0].toUpperCase();
  document.getElementById('player-name').textContent   = username;
  await refreshRankings();
  reset();
}

// ── RANKING ──────────────────────────────────────────────────────────

async function refreshRankings(highlightUser) {
  try {
    const rankings = await apiCall('GET', '/api/rankings');
    renderRanking(rankings, highlightUser);
  } catch (_) {}
}

async function recordWin(attempts) {
  try {
    const rankings = await apiCall('POST', '/api/win', { attempts });
    renderRanking(rankings, currentUser);
  } catch (err) {
    toast(err.message);
  }
}

const MEDALS       = ['🥇', '🥈', '🥉'];
const MEDAL_CLASS  = ['gold', 'silver', 'bronze'];

function renderRanking(rankings, highlightUser) {
  const list = document.getElementById('rank-list');
  list.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const entry = rankings[i];
    const item  = document.createElement('div');

    const isMe  = entry && entry.username === currentUser;
    const isNew = entry && entry.username === highlightUser;
    item.className = 'rank-item' + (isMe ? ' rank-me' : '') + (isNew ? ' rank-new' : '');

    const posEl = document.createElement('div');
    posEl.className = 'rank-pos' + (i < 3 && entry ? ` ${MEDAL_CLASS[i]}` : '');
    posEl.textContent = entry && i < 3 ? MEDALS[i] : i + 1;

    const nameEl = document.createElement('div');
    nameEl.className = 'rank-name' + (entry ? '' : ' empty');
    nameEl.textContent = entry ? entry.username : '—';

    item.appendChild(posEl);
    item.appendChild(nameEl);

    if (entry) {
      const badge = document.createElement('div');
      badge.className   = 'rank-badge';
      badge.textContent = entry.attempts === 1 ? '1 intento' : `${entry.attempts} intentos`;
      item.appendChild(badge);
    }

    list.appendChild(item);
  }
}

// ── GAME ──────────────────────────────────────────────────────────────

const TARGET   = 'FABULA';
const COLS     = TARGET.length;
const MAX_ROWS = 6;

let grid   = [];
let curRow = 0;
let curCol = 0;
let guess  = [];
let locked = false;

function isGameActive() {
  return document.getElementById('game-screen').style.display === 'flex';
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  grid = [];
  for (let r = 0; r < MAX_ROWS; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    rowEl.id = `row-${r}`;
    const rowData = [];
    for (let c = 0; c < COLS; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      rowEl.appendChild(tile);
      rowData.push({ el: tile });
    }
    board.appendChild(rowEl);
    grid.push(rowData);
  }
}

function addLetter(l) {
  if (locked || curCol >= COLS) return;
  const cell = grid[curRow][curCol];
  cell.el.textContent = l;
  cell.el.setAttribute('data-letter', l);
  cell.el.classList.remove('pop');
  void cell.el.offsetWidth;
  cell.el.classList.add('pop');
  guess.push(l);
  curCol++;
}

function delLetter() {
  if (locked || curCol === 0) return;
  curCol--;
  guess.pop();
  const cell = grid[curRow][curCol];
  cell.el.textContent = '';
  cell.el.removeAttribute('data-letter');
}

function submit() {
  if (locked) return;
  if (curCol < COLS) { shake(curRow); toast('Faltan letras'); return; }
  const word   = guess.join('');
  const result = evaluate(word);
  locked = true;
  revealRow(curRow, word, result);
}

function evaluate(word) {
  const res    = Array(COLS).fill('absent');
  const target = TARGET.split('');
  const w      = word.split('');
  for (let i = 0; i < COLS; i++) {
    if (w[i] === target[i]) { res[i] = 'correct'; target[i] = null; w[i] = null; }
  }
  for (let i = 0; i < COLS; i++) {
    if (w[i] === null) continue;
    const j = target.indexOf(w[i]);
    if (j !== -1) { res[i] = 'present'; target[j] = null; }
  }
  return res;
}

function revealRow(row, word, result) {
  const FLIP_OUT = 180, FLIP_IN = 220, GAP = 130;
  result.forEach((state, i) => {
    const tile = grid[row][i].el;
    setTimeout(() => {
      tile.classList.add('flip-out');
      setTimeout(() => {
        tile.classList.remove('flip-out');
        tile.classList.add(state, 'flip-in');
        updateKey(word[i], state);
        setTimeout(() => tile.classList.remove('flip-in'), FLIP_IN);
      }, FLIP_OUT);
    }, i * GAP);
  });
  const total = (COLS - 1) * GAP + FLIP_OUT + FLIP_IN + 80;
  setTimeout(() => {
    if (word === TARGET) { winGame(row); }
    else {
      curRow++; curCol = 0; guess = []; locked = false;
      if (curRow >= MAX_ROWS) loseGame();
    }
  }, total);
}

const keyPriority = { correct: 3, present: 2, absent: 1 };

function updateKey(letter, state) {
  const btn = document.querySelector(`.key[data-key="${letter}"]`);
  if (!btn) return;
  const cur = btn.classList.contains('correct') ? 'correct'
            : btn.classList.contains('present') ? 'present'
            : btn.classList.contains('absent')  ? 'absent' : null;
  if (!cur || keyPriority[state] > keyPriority[cur]) {
    if (cur) btn.classList.remove(cur);
    btn.classList.add(state);
  }
}

const WIN_MSGS = ['¡Increíble!','¡Excelente!','¡Brillante!','¡Muy bien!','¡Bien!','¡Uf, por poco!'];

function winGame(row) {
  const attempts = row + 1;
  grid[row].forEach((cell, i) => {
    setTimeout(() => {
      cell.el.classList.remove('bounce'); void cell.el.offsetWidth; cell.el.classList.add('bounce');
    }, i * 90);
  });
  launchConfetti();
  recordWin(attempts);
  setTimeout(() => {
    document.getElementById('m-icon').textContent  = '🎉';
    document.getElementById('m-title').textContent = '¡Ganaste!';
    document.getElementById('m-desc').textContent  = WIN_MSGS[Math.min(row, WIN_MSGS.length - 1)];
    openModal();
  }, 1400);
}

function loseGame() {
  setTimeout(() => {
    document.getElementById('m-icon').textContent  = '😔';
    document.getElementById('m-title').textContent = '¡Game Over!';
    document.getElementById('m-desc').textContent  = 'La palabra era';
    openModal();
  }, 400);
}

function openModal()  { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

const CONFETTI_COLORS = ['#c084fc','#818cf8','#38bdf8','#4ade80','#fbbf24','#f87171','#fb7185'];

function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left       = Math.random() * 100 + 'vw';
      p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      p.style.width      = (8 + Math.random() * 8)  + 'px';
      p.style.height     = (8 + Math.random() * 14) + 'px';
      p.style.opacity    = 0.85;
      const dur = 1.8 + Math.random() * 2;
      p.style.animationDuration = dur + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), dur * 1000 + 100);
    }, i * 30);
  }
}

let toastTimer = null;
function toast(msg, ms = 1800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function shake(row) {
  const rowEl = document.getElementById(`row-${row}`);
  rowEl.classList.remove('shake'); void rowEl.offsetWidth; rowEl.classList.add('shake');
  setTimeout(() => rowEl.classList.remove('shake'), 500);
}

function reset() {
  closeModal();
  curRow = 0; curCol = 0; guess = []; locked = false;
  document.querySelectorAll('.key').forEach(k => k.classList.remove('correct','present','absent'));
  buildBoard();
}

// ── EVENTS ────────────────────────────────────────────────────────────

document.querySelectorAll('.key').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!isGameActive()) return;
    const k = btn.dataset.key;
    if (k === 'ENTER')          submit();
    else if (k === 'BACKSPACE') delLetter();
    else addLetter(k);
  });
});

document.getElementById('m-btn').addEventListener('click', reset);

document.addEventListener('keydown', e => {
  if (!isGameActive()) return;
  if (document.getElementById('modal').classList.contains('open')) {
    if (e.key === 'Enter') reset();
    return;
  }
  const k = e.key.toUpperCase();
  if (k === 'ENTER')           { e.preventDefault(); submit(); }
  else if (k === 'BACKSPACE')   delLetter();
  else if (/^[A-ZÑ]$/.test(k)) addLetter(k);
});

// ── INIT ──────────────────────────────────────────────────────────────

const savedUser = getStoredUser();
if (savedUser && getToken()) enterGame(savedUser);
</script>
